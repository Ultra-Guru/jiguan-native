name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 宿主检查: 格式 / 静态 lint / 全量单测 (x86_64 Linux)
  # ------------------------------------------------------------------
  host-tests:
    name: host-tests (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  # ------------------------------------------------------------------
  # Android 交叉构建: aarch64-linux-android → libjiguan.so
  # ------------------------------------------------------------------
  android-build:
    name: android-build (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3

      - name: 安装 NDK 27.0.12077973
        run: sdkmanager --install "ndk;27.0.12077973"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "android-aarch64"

      - name: 构建 libjiguan.so (release)
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER" --version
          cargo build --target aarch64-linux-android --release

      - name: 上传 libjiguan.so
        uses: actions/upload-artifact@v4
        with:
          name: libjiguan-android-aarch64
          path: target/aarch64-linux-android/release/libjiguan.so
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # tag v* 发布: 附带 .so 的 GitHub Release
  # ------------------------------------------------------------------
  release:
    name: release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: libjiguan-android-aarch64
          path: dist

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/libjiguan.so
          generate_release_notes: true
          fail_on_unmatched_files: true
