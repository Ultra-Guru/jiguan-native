name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 宿主检查: 格式 / 静态 lint / 全量单测 (x86_64 Linux)
  # ------------------------------------------------------------------
  host-tests:
    name: host-tests (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  # ------------------------------------------------------------------
  # Android 交叉构建: aarch64-linux-android → libjiguan.so
  # ------------------------------------------------------------------
  android-build:
    name: android-build (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "android-aarch64"

      # ubuntu-latest 预装 Android SDK + NDK（runner image 规格）—— 动态发现
      # 最高版本；全部缺席才 sdkmanager 兜底（setup-android 独立动作的
      # sdkmanager 通道实测抖动，弃用）。
      - name: 定位 NDK clang 链接器
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR=""
          if [ -d "$SDK/ndk" ]; then
            LATEST=$(ls -1v "$SDK/ndk" 2>/dev/null | tail -1 || true)
            if [ -n "$LATEST" ]; then NDK_DIR="$SDK/ndk/$LATEST"; fi
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "runner 未预装 NDK —— sdkmanager 兜底安装"
            CT="$SDK/cmdline-tools/latest/bin"
            [ -x "$CT/sdkmanager" ] || CT="$SDK/cmdline-tools/bin"
            yes | "$CT/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$CT/sdkmanager" --install "ndk;27.2.12479018"
            NDK_DIR="$SDK/ndk/27.2.12479018"
          fi
          echo "NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "使用 NDK: $NDK_DIR"

      - name: 构建 libjiguan.so (release)
        run: |
          set -euo pipefail
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER" --version
          cargo build --target aarch64-linux-android --release

      - name: 上传 libjiguan.so
        uses: actions/upload-artifact@v4
        with:
          name: libjiguan-android-aarch64
          path: target/aarch64-linux-android/release/libjiguan.so
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # tag v* 发布: 附带 .so 的 GitHub Release
  # ------------------------------------------------------------------
  release:
    name: release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: libjiguan-android-aarch64
          path: dist

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/libjiguan.so
          generate_release_notes: true
          fail_on_unmatched_files: true
